version=1
[application]
field="tracer"
[mesh]
file="mesh.h5" # Partitioned solver mesh; generate from mesh.toml, then partition.
[boundary]
file="boundary.toml"
[time]
mode="transient"
dt=0.005
end_time=0.1
maximum_steps=100
[output]
enabled=true
directory="output"
interval=5
[scalars.tracer.physics]
density=1.0
velocity=[0.2,0.1,0.0]
convection=true
diffusion=true
diffusion_coefficient=0.005
[scalars.tracer.initial_condition]
type="gaussian"
background=0.0
amplitude=1.0
centre=[0.4,0.45,0.5]
width=0.12
[scalars.tracer.numerics.gradient]
method="least_squares_face"
interpolation="auxiliary_weights"
[scalars.tracer.numerics.reconstruction]
method="tvd"
tvd_limiter="van_leer"
skew_correction=true
cell_limiter="barth_jespersen"
[scalars.tracer.numerics.diffusion]
nonorthogonal_correction=false
[scalars.tracer.time]
scheme="bdf2"
[scalars.tracer.outer_iteration]
maximum_iterations=200
relaxation=1.0
[scalars.tracer.linear_solver]
method="GMRES"
preconditioner="RELAXATION"
maximum_iterations=1000
restart_length=100
verify_residual=false
[scalars.tracer.verification]
enabled=true
maximum_l2_error=0.02
