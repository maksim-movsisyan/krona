version=1
[application]
field="tracer"
[mesh]
file="mesh.h5" # Partitioned solver mesh; generate from mesh.toml, then partition.
[boundary]
file="boundary.toml"
[time]
mode="steady"
[output]
enabled=true
directory="output"
interval=5
[scalars.tracer.physics]
density=1.0
convection=false
diffusion=true
diffusion_coefficient=0.1
[scalars.tracer.initial_condition]
type="constant"
value=200.0
[scalars.tracer.reference]
type="linear"
value=300.0
gradient=[100.0,0.0,0.0]
[scalars.tracer.numerics.gradient]
method="least_squares_face"
interpolation="auxiliary_weights"
[scalars.tracer.numerics.reconstruction]
method="upwind"
[scalars.tracer.numerics.diffusion]
nonorthogonal_correction=true
[scalars.tracer.time]
scheme="backward_euler"
[scalars.tracer.outer_iteration]
maximum_iterations=200
relaxation=1.0
[scalars.tracer.linear_solver]
method="GMRES"
preconditioner="RELAXATION"
maximum_iterations=1000
restart_length=100
verify_residual=false
[scalars.tracer.verification]
enabled=true
maximum_l2_error=0.02
