# Import metadata is retained; physical type is independent of each scalar field.
[[boundary_condition]]
patch_id = 0
name = "fixed"
family = "inlet"
source_type = "BCInflow"
global_face_count = 2
type = "INLET_TOTAL_TP"

[boundary_condition.scalar.temperature]
type = "FIXED_VALUE"
value = 5.0

[boundary_condition.scalar.tracer]
type = "FIXED_VALUE"
value = 0.25

[[boundary_condition]]
patch_id = 1
name = "gradient"
family = "wall"
source_type = "BCWall"
global_face_count = 1
type = "USER_DEFINED"

[boundary_condition.scalar.temperature]
type = "NORMAL_GRADIENT"
gradient = -2.0

[boundary_condition.scalar.tracer]
type = "ZERO_GRADIENT"

[[boundary_condition]]
patch_id = 2
name = "flux"
family = "wall"
source_type = "BCWall"
global_face_count = 1
type = "USER_DEFINED"

[boundary_condition.scalar.temperature]
type = "FIXED_FLUX"
flux = 6.0

[boundary_condition.scalar.tracer]
type = "ZERO_GRADIENT"

[unlabelled.scalar.temperature]
type = "ZERO_GRADIENT"

[unlabelled.scalar.tracer]
type = "ZERO_GRADIENT"
