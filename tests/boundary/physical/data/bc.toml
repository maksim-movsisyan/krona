# One file: flow and independent scalar catalogues share patch metadata.
[[boundary_condition]]
patch_id = 0
name = "inlet"
family = "inlet"
source_type = "BCInflow"
global_face_count = 1
type = "INLET_VELOCITY"
[boundary_condition.physical]
velocity = [20, 0, 0]
temperature = 300
[boundary_condition.scalar.temperature]
type = "FIXED_VALUE"
value = 300
[boundary_condition.scalar.tracer]
type = "FIXED_VALUE"
value = 0.25

[[boundary_condition]]
patch_id = 1
name = "wall"
family = "wall"
source_type = "BCWall"
global_face_count = 1
type = "WALL_ISOTHERMAL"
[boundary_condition.physical]
temperature = 350
[boundary_condition.scalar.temperature]
type = "FIXED_VALUE"
value = 350
[boundary_condition.scalar.tracer]
type = "ZERO_GRADIENT"

[[boundary_condition]]
patch_id = 2
name = "outlet"
family = "outlet"
source_type = "BCOutflow"
global_face_count = 1
type = "OUTLET_PRESSURE"
[boundary_condition.physical]
pressure = 100000
[boundary_condition.scalar.temperature]
type = "ZERO_GRADIENT"
[boundary_condition.scalar.tracer]
type = "ZERO_GRADIENT"

# A scalar-only unlabelled table does not configure unlabelled flow boundaries.
[unlabelled.scalar.temperature]
type = "ZERO_GRADIENT"
[unlabelled.scalar.tracer]
type = "ZERO_GRADIENT"
